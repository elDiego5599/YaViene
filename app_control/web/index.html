<!DOCTYPE html>
<html lang="es">
<head>
  <!-- `flutter build web --base-href` cambia esto si el panel no se sirve
       en la raíz; tiene que empezar y terminar en «/». -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Panel de Ya Viene para las empresas de buses.">
  <!-- El panel es de la empresa: que no salga en buscadores. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- El mismo ícono que en macOS y Windows (assets/icon/app_icon.png). -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Ya Viene Control</title>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
