<!-- Mismo marcador que dibuja createFlatTransitMarker() en
     app_pasajero/lib/features/map/presentation/widgets/map_markers.dart:
     cápsula de 32x60 sobre un lienzo de 96, degradado más claro arriba,
     anillo blanco de 2.6 y un parabrisas insinuado. Color: AppColors.busActive. -->
<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="busBody" x1="0" y1="0.3" x2="0" y2="0.81">
      <stop offset="0%" stop-color="#EF978E"/>
      <stop offset="100%" stop-color="#E86A5E"/>
    </linearGradient>
    <clipPath id="busClip">
      <rect x="32" y="18" width="32" height="60" rx="16"/>
    </clipPath>
  </defs>
  <rect x="32" y="18" width="32" height="60" rx="16" fill="url(#busBody)"/>
  <ellipse cx="48" cy="32.4" rx="11.5" ry="7.8" fill="#FFFFFF" opacity="0.3" clip-path="url(#busClip)"/>
  <rect x="32" y="18" width="32" height="60" rx="16" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-opacity="0.92"/>
</svg>
