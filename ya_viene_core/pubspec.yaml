name: ya_viene_core
description: Core compartido del sistema Ya Viene (Modelos, Temas, Providers Base).
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  equatable: ^2.0.5
  http: ^1.2.0
  # Solo por `WebSocketConnectionClosed` (zona_socket.dart). Ya llega a las
  # dos apps de la mano de socket_io_client; aquí se nombra la versión.
  web_socket: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Solo para el hash del glosario (glosario_test.dart); ya viene con el SDK.
  crypto: ^3.0.3
  # analysis_options.yaml incluye su flutter.yaml: sin declararlo aquí el
  # análisis del core depende de que otro paquete lo haya bajado antes.
  flutter_lints: ^6.0.0

flutter:
  # Los recorridos de las rutas (`kRutasAsset`): los pintan el pasajero y el
  # panel, y `convert-rutas.mjs` del backend los escribe aquí.
  assets:
    - assets/data/

# ── Importante: El core no debe depender de MapLibre, Mapbox o MQTT directamente.
# Es estrictamente para modelos de dominio puros y el sistema de diseño visual.
