name: ya_viene_core
description: Core compartido del sistema Ya Viene (Modelos, Temas, Providers Base).
version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  equatable: ^2.0.5
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  # analysis_options.yaml incluye su flutter.yaml: sin declararlo aquí el
  # análisis del core depende de que otro paquete lo haya bajado antes.
  flutter_lints: ^6.0.0

# ── Importante: El core no debe depender de MapLibre, Mapbox o MQTT directamente.
# Es estrictamente para modelos de dominio puros y el sistema de diseño visual.
