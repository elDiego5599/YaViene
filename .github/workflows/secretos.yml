name: Barrido completo de secretos

# El job `secretos` de la CI usa gitleaks-action, que solo mira los commits
# del push o del PR. Este corre el binario sobre todo: el historial de todas
# las ramas y tags (modo git) y el árbol tal como está (modo dir). Corre cada
# semana y en cada push. La corrida semanal sale de main: GitHub solo programa
# los workflows que están en la rama por defecto.
on:
  schedule:
    # Lunes 06:23 en Barranquilla (11:23 UTC). El minuto no es en punto a
    # propósito: a las horas en punto la cola de GitHub se atrasa.
    - cron: '23 11 * * 1'
  push:
    branches: [main, prueba]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 trae todas las ramas y tags, no solo la del push.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Binario oficial, en la misma versión que la acción y comprobado
      # contra la suma publicada: si no cuadra, el job se cae aquí.
      - name: Instalar gitleaks
        env:
          VERSION: 8.30.1
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          archivo="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfLO "$base/$archivo"
          curl -sSfLO "$base/gitleaks_${VERSION}_checksums.txt"
          grep " ${archivo}\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$archivo" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      # Sin --log-opts, gitleaks recorre el historial de todas las ramas y
      # tags; la acción, en cambio, le pasa solo el rango del push. Los
      # falsos positivos ya revisados van en .gitleaksignore.
      - name: Historial completo (modo git)
        run: gitleaks git . --redact --no-banner --verbose

      # El modo git lee los diffs, que traen solo las líneas cambiadas; el
      # modo dir lee cada archivo entero tal como quedó. Van los dos porque
      # una regla puede casar en uno y no en el otro.
      - name: Árbol (modo dir)
        run: gitleaks dir . --redact --no-banner --verbose
