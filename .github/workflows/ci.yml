name: Ya Viene CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Test and analyze core
        working-directory: ya_viene_core
        run: |
          flutter pub get
          flutter analyze lib
          flutter test

      - name: Analyze conductor
        working-directory: app_conductor
        run: |
          flutter pub get
          flutter analyze lib
          flutter test

      - name: Analyze passenger
        working-directory: app_pasajero
        run: |
          flutter pub get
          flutter analyze lib
