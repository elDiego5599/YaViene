name: Ya Viene CI

on:
  # Solo main. Se trabaja en `prueba` y cada commit sube a las dos ramas a
  # la vez: con las dos aquí, el mismo commit se probaba dos veces y se
  # pagaban dos veces los minutos, que en un repo privado tienen cuota.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Las compilaciones corren aquí y a mano, no en cada push (ver abajo).
  # Martes 06:41 en Barranquilla (11:41 UTC), fuera de la hora en punto.
  schedule:
    - cron: '41 11 * * 2'
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'https:// del backend para el panel de Windows que se descarga (vacío: solo compila)'
        required: false
        default: ''

# El token de la corrida se le presta a código de terceros, así que va con lo
# mínimo: ningún job de aquí escribe en el repositorio. Sin este bloque iba
# con los permisos por omisión, que incluyen escritura.
permissions:
  contents: read

# Si llega un commit nuevo a la misma rama mientras la corrida anterior
# sigue, la vieja se cancela: su resultado ya no le importa a nadie.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Cada acción va clavada al commit y no a la etiqueta: una etiqueta se mueve
# sin avisar y con ella cambia el código de terceros que corre con ese token.
# La versión legible queda al lado; para subir una se resuelve la etiqueta con
# `gh api repos/DUEÑO/ACCION/commits/ETIQUETA --jq .sha` y se cambian el SHA y
# el comentario en el mismo commit. Las elegidas corren en Node 24: GitHub
# quita Node 20 de sus runners el 16 de septiembre de 2026 y las @v4 dejan de
# arrancar; flutter-action es compuesta y no corre en Node, pero se clava
# igual, que es de donde viene el riesgo.
#
# Flutter va en una versión exacta, la misma del Mac donde se trabaja. Con
# `channel: stable` a secas, el día que Flutter publica una versión nueva la
# CI analiza con un compilador distinto al de quien subió el código y
# `--fatal-infos` la tumba sin que nadie haya tocado una línea. Para subirla:
# se actualiza el Mac, se corre `flutter analyze --fatal-infos` y las pruebas
# en los tres paquetes, y recién ahí se cambia aquí.
jobs:
  # Barrido de secretos (T3.12). gitleaks-action revisa los commits del push
  # o del PR, no el árbol: no tiene modo sin git. Necesita el historial
  # completo, y los falsos positivos ya revisados van en .gitleaksignore.
  secretos:
    # La corrida semanal no trae commits nuevos que mirar; el barrido
    # completo de la semana va en secretos.yml.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  flutter:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      # --fatal-infos: un aviso de estilo también tumba la CI. Sin eso los
      # infos se acumulaban (31 en el pasajero) porque `analyze` solo
      # falla con errores y warnings.
      - name: Test and analyze core
        working-directory: ya_viene_core
        run: |
          flutter pub get
          flutter analyze --fatal-infos lib test
          flutter test --coverage

      # Guías de prueba compartidas por las dos apps (la de contraste a tres
      # píxeles por punto). No llega a ninguna app compilada, pero sus propias
      # pruebas son las que dicen que mide lo mismo que la de Flutter.
      - name: Test and analyze pruebas
        working-directory: ya_viene_pruebas
        run: |
          flutter pub get
          flutter analyze --fatal-infos lib test
          flutter test

      # Las pruebas de oro (`@Tags(['goldens'])`) no corren en la CI, en
      # ninguna de sus máquinas. Las 34 fotos se tomaron en el Mac del dueño:
      # en Linux fallaban las 34 y en el macOS de GitHub fallan 19 de 34, sin
      # que la pantalla haya cambiado —cada máquina dibuja el texto un poco
      # distinto—. Regenerarlas aquí solo movería el fallo al Mac del dueño, y
      # aflojar la tolerancia dejaría pasar regresiones de verdad. Son una
      # prueba local: `flutter test --tags goldens` donde se hicieron, antes
      # de subir (está en el README del pasajero).
      - name: Analyze passenger
        working-directory: app_pasajero
        run: |
          flutter pub get
          flutter analyze --fatal-infos lib test
          flutter test --coverage --exclude-tags goldens

      - name: Analyze and test control
        working-directory: app_control
        run: |
          flutter pub get
          flutter analyze --fatal-infos lib test
          flutter test --coverage

      # Trinquete de cobertura (T8.7). No vuelve a correr las pruebas: lee el
      # lcov que acaban de dejar los tres pasos de arriba. Los umbrales están
      # en el propio script, son la cobertura del día que se puso y sólo
      # suben; quien los baje tiene que decir en el commit por qué.
      - name: Trinquete de cobertura
        run: tool/cobertura.sh --sin-correr

      # Informe, no barrera: pub no tiene un audit como npm y una versión
      # nueva no es una vulnerabilidad. Queda en el log para la revisión
      # mensual de librerías (D11) y no tumba la CI.
      - name: Dependencias desactualizadas (informe)
        continue-on-error: true
        run: |
          for app in ya_viene_core app_pasajero app_control; do
            echo "== $app"
            (cd "$app" && flutter pub outdated --no-dev-dependencies)
          done

  # Panel contra un backend de verdad (T8.6). `socket_fleet_test.dart` es la
  # única prueba que habla con el servidor por socket, y sin cuenta con qué
  # entrar se salta sola: pasa en verde sin probar nada. Este job levanta un
  # backend de usar y tirar —base temporal, puerto propio, usuario y clave
  # inventados en la corrida— y la hace correr de verdad.
  #
  # Va a mano porque necesita el código del backend, que vive en otro
  # repositorio privado: el token de la corrida no llega hasta allá. Mientras
  # no exista el secreto BACKEND_REPO_TOKEN —un token del dueño con permiso
  # de sólo lectura sobre YaVieneBackend— el job avisa y se queda quieto en
  # vez de fallar. La prueba se corre igual en el Mac del dueño con
  # `tool/prueba-socket-panel.sh`, que es lo mismo que corre aquí.
  socket-panel:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Ver si hay con qué traer el backend
        id: llave
        env:
          TOKEN: ${{ secrets.BACKEND_REPO_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "Falta el secreto BACKEND_REPO_TOKEN (lectura de YaVieneBackend);"
            echo "sin él este job no puede traer el backend. No se corre nada."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.llave.outputs.hay == 'si'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Al lado, que es donde el script lo busca por omisión.
      - if: steps.llave.outputs.hay == 'si'
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: ElDiego5599/YaVieneBackend
          ref: main
          token: ${{ secrets.BACKEND_REPO_TOKEN }}
          path: YaVieneBackend
          persist-credentials: false

      - if: steps.llave.outputs.hay == 'si'
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      - if: steps.llave.outputs.hay == 'si'
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      - if: steps.llave.outputs.hay == 'si'
        name: Dependencias del backend
        working-directory: YaVieneBackend
        run: npm ci

      # El script se inventa el usuario, la clave y los secretos de la
      # corrida: la cuenta de prueba del dueño no entra aquí.
      - if: steps.llave.outputs.hay == 'si'
        name: Socket del panel contra backend temporal
        env:
          YAVIENE_BACKEND: ${{ github.workspace }}/YaVieneBackend
        run: |
          cd app_control && flutter pub get && cd ..
          tool/prueba-socket-panel.sh

  # Compilar es la única prueba de que lo que se entrega arranca: `flutter
  # test` no pasa por Gradle, Xcode ni MSBuild, así que un plugin roto, una
  # firma mal puesta o un SDK que sube su mínimo solo se ven al construir
  # (NEW-05, NEW-06). Los tres jobs van sueltos, sin `needs`, para que un
  # fallo de análisis no esconda un fallo de compilación, y porque corren en
  # máquinas distintas.
  #
  # Cuesta: el repo es privado, y ahí GitHub descuenta el minuto de macOS por
  # 10 y el de Windows por 2 de la cuota. El `timeout-minutes` de cada job es
  # el tope de ese gasto si una compilación se queda colgada.
  #
  # Por eso no corren en cada push: una corrida con las tres costaba unos 90
  # minutos de cuota, 70 de ellos el job de Apple, y la cuota se acabó. El
  # APK, el iOS y el macOS ya se compilan en el Mac del dueño con cada cambio
  # de app (regla del proyecto), así que Apple queda solo a mano, desde la
  # pestaña Actions. Android y Windows corren además una vez por semana:
  # Windows es el único sitio donde se arma el panel de escritorio de la
  # empresa, y así un fallo ahí no pasa más de siete días sin verse.
  compilar-apple:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      # Sin firma: la CI no tiene el certificado del dueño ni debe tenerlo.
      # Aun así compila el binario, que es lo que se vigila. El dominio de
      # BACKEND_URL es inválido a propósito: `config.dart` exige la variable
      # y exige https, y aquí no se conecta nadie a ningún lado.
      - name: iOS del pasajero (sin firma)
        working-directory: app_pasajero
        run: |
          flutter pub get
          flutter build ios --no-codesign --dart-define=BACKEND_URL=https://ejemplo.invalid

      # El panel se firma «ad hoc» (`CODE_SIGN_IDENTITY = "-"` en el
      # proyecto de Xcode), así que compila sin cuenta de desarrollador.
      - name: macOS del panel
        working-directory: app_control
        run: |
          flutter pub get
          flutter build macos

  compilar-android:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Gradle 9.1 y el plugin de Android 9.0.1 piden un JDK moderno. Se fija
      # aquí para que el build no dependa del JDK que traiga el runner el día
      # que GitHub cambie la imagen.
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      # `key.properties` y el keystore están fuera de git, así que aquí la
      # release cae a la firma de depuración (app/build.gradle.kts). Es a
      # propósito: la CI comprueba que compila; la APK que se entrega se
      # firma en la máquina del dueño.
      - name: APK del pasajero
        working-directory: app_pasajero
        run: |
          flutter pub get
          flutter build apk --dart-define=BACKEND_URL=https://ejemplo.invalid

  compilar-windows:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 45
    # bash, no pwsh: con pwsh un ejecutable que devuelve error no corta el
    # paso, y el `flutter pub get` fallido pasaría inadvertido.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true

      # Aquí no hay máquina con Windows: este job es el único sitio donde se
      # ve si el panel sigue armándose para el escritorio de la empresa.
      - name: Windows del panel
        working-directory: app_control
        run: |
          flutter pub get
          flutter build windows

      # Para probarlo en un Windows de verdad: a mano y con `backend_url`,
      # la misma compilación apunta al backend y queda para descargar desde
      # la corrida. Sin la URL no se sube nada: `config.dart` la exige y un
      # panel sin ella no arranca.
      - name: Windows del panel contra el backend
        if: inputs.backend_url != ''
        working-directory: app_control
        env:
          BACKEND_URL: ${{ inputs.backend_url }}
        run: flutter build windows --release --dart-define=BACKEND_URL="$BACKEND_URL"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.backend_url != ''
        with:
          name: panel-windows
          path: app_control/build/windows/x64/runner/Release/
          retention-days: 7
