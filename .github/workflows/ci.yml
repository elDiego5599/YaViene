name: Ya Viene CI

on:
  # `prueba` es donde se trabaja: sin esto, lo que se sube ahí no pasaba
  # por ninguna prueba hasta llegar a main.
  push:
    branches: [main, prueba]
  pull_request:
    branches: [main]

# Las acciones van en versiones que corren en Node 24: GitHub quita Node 20
# de sus runners el 16 de septiembre de 2026 y las @v4 dejan de arrancar.
# flutter-action@v2 es compuesta (no corre en Node), por eso no cambia.
jobs:
  # Barrido de secretos (T3.12). gitleaks-action revisa los commits del push
  # o del PR, no el árbol: no tiene modo sin git. Necesita el historial
  # completo, y los falsos positivos ya revisados van en .gitleaksignore.
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --fatal-infos: un aviso de estilo también tumba la CI. Sin eso los
      # infos se acumulaban (31 en el pasajero) porque `analyze` solo
      # falla con errores y warnings.
      - name: Test and analyze core
        working-directory: ya_viene_core
        run: |
          flutter pub get
          flutter analyze --fatal-infos lib test
          flutter test

      - name: Analyze conductor
        working-directory: app_conductor
        run: |
          flutter pub get
          flutter analyze lib
          flutter test

      # Las pruebas de oro (`@Tags(['goldens'])`) se quedan fuera de esta
      # máquina: las 34 fotos se tomaron en un Mac y aquí, en Linux, el texto
      # se dibuja con medio píxel de diferencia, así que fallaban las 34 sin
      # que hubiera cambiado nada. Se comparan en `compilar-apple`, que ya
      # corre en macOS; regenerarlas en Linux solo movería el problema al Mac
      # del dueño, y aflojar la tolerancia dejaría pasar regresiones de verdad.
      - name: Analyze passenger
        working-directory: app_pasajero
        run: |
          flutter pub get
          flutter analyze --fatal-infos lib test
          flutter test --exclude-tags goldens

      - name: Analyze and test control
        working-directory: app_control
        run: |
          flutter pub get
          flutter analyze --fatal-infos lib test
          flutter test

      # Informe, no barrera: pub no tiene un audit como npm y una versión
      # nueva no es una vulnerabilidad. Queda en el log para la revisión
      # mensual de librerías (D11) y no tumba la CI.
      - name: Dependencias desactualizadas (informe)
        continue-on-error: true
        run: |
          for app in ya_viene_core app_pasajero app_control; do
            echo "== $app"
            (cd "$app" && flutter pub outdated --no-dev-dependencies)
          done

  # Compilar es la única prueba de que lo que se entrega arranca: `flutter
  # test` no pasa por Gradle, Xcode ni MSBuild, así que un plugin roto, una
  # firma mal puesta o un SDK que sube su mínimo solo se ven al construir
  # (NEW-05, NEW-06). Los tres jobs van sueltos, sin `needs`, para que un
  # fallo de análisis no esconda un fallo de compilación, y porque corren en
  # máquinas distintas.
  #
  # Cuesta: el repo es privado, y ahí GitHub descuenta el minuto de macOS por
  # 10 y el de Windows por 2 de la cuota. El `timeout-minutes` de cada job es
  # el tope de ese gasto si una compilación se queda colgada.
  compilar-apple:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Sin firma: la CI no tiene el certificado del dueño ni debe tenerlo.
      # Aun así compila el binario, que es lo que se vigila. El dominio de
      # BACKEND_URL es inválido a propósito: `config.dart` exige la variable
      # y exige https, y aquí no se conecta nadie a ningún lado.
      - name: iOS del pasajero (sin firma)
        working-directory: app_pasajero
        run: |
          flutter pub get
          flutter build ios --no-codesign --dart-define=BACKEND_URL=https://ejemplo.invalid

      # El panel se firma «ad hoc» (`CODE_SIGN_IDENTITY = "-"` en el
      # proyecto de Xcode), así que compila sin cuenta de desarrollador.
      - name: macOS del panel
        working-directory: app_control
        run: |
          flutter pub get
          flutter build macos

      # Aquí, y no en el job de Linux, porque estas fotos se tomaron en macOS.
      # Va al final a propósito: primero se ve si compila, que es lo que este
      # job vigila; un cambio visual no debe esconder un fallo de compilación.
      - name: Fotos de referencia del pasajero
        working-directory: app_pasajero
        run: flutter test --tags goldens

  compilar-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Gradle 9.1 y el plugin de Android 9.0.1 piden un JDK moderno. Se fija
      # aquí para que el build no dependa del JDK que traiga el runner el día
      # que GitHub cambie la imagen.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # `key.properties` y el keystore están fuera de git, así que aquí la
      # release cae a la firma de depuración (app/build.gradle.kts). Es a
      # propósito: la CI comprueba que compila; la APK que se entrega se
      # firma en la máquina del dueño.
      - name: APK del pasajero
        working-directory: app_pasajero
        run: |
          flutter pub get
          flutter build apk --dart-define=BACKEND_URL=https://ejemplo.invalid

  compilar-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    # bash, no pwsh: con pwsh un ejecutable que devuelve error no corta el
    # paso, y el `flutter pub get` fallido pasaría inadvertido.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Aquí no hay máquina con Windows: este job es el único sitio donde se
      # ve si el panel sigue armándose para el escritorio de la empresa.
      - name: Windows del panel
        working-directory: app_control
        run: |
          flutter pub get
          flutter build windows
