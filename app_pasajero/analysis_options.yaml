include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # Un `flutter build ios` deja aquí el checkout de SwiftPM: código
    # ajeno que el analizador recorre y que ahogaba los avisos propios
    # (49) bajo once mil que no son nuestros.
    - "build/**"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    # Estilo
    - always_declare_return_types
    - avoid_print           # Usar Logger, no print()
    - directives_ordering
    - file_names
    - lines_longer_than_80_chars
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
