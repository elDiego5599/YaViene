name: ya_viene_pasajero
description: Aplicación de seguimiento de transporte público en tiempo real - Barranquilla.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ── Idioma ───────────────────────────────────────────────────────────────────
  # Sin esto, `locale: es_CO` en `main.dart` no cambia nada: los menús que
  # dibuja el sistema —copiar, pegar, seleccionar todo, los tooltips— salen
  # en inglés porque Material solo trae inglés de fábrica.
  flutter_localizations:
    sdk: flutter

  # ── Paquetes Locales (Monorepo) ─────────────────────────────────────────────
  ya_viene_core:
    path: ../ya_viene_core

  # ── State Management ─────────────────────────────────────────────────────────
  flutter_riverpod: ^2.5.1

  # ── Navigation ───────────────────────────────────────────────────────────────
  go_router: ^17.4.0

  # ── Mapa (Motor nativo MapLibre GL — Open Source sin llaves)
  maplibre_gl: ^0.26.1

  # ── Networking & Real-time ────────────────────────────────────────────────────
  # NOTA: El pasajero SOLO consume via WebSocket (lectura). NO hay MQTT.
  # Tiempo real: las posiciones de los buses llegan del backend por Socket.IO.
  socket_io_client: ^3.1.6

  # ── Local Storage ─────────────────────────────────────────────────────────────
  shared_preferences: ^2.3.1

  # ── UI ────────────────────────────────────────────────────────────────────────
  # NOTA: SIN google_fonts. La fuente Plus Jakarta Sans se registra
  # nativamente en la sección `flutter.fonts` de este archivo y se lee del
  # bundle de la app (ya_viene_core la referencia por nombre 'PlusJakartaSans').
  # Esto elimina el FOUT (Flash of Unstyled Text) y la dependencia de red.
  flutter_svg: ^2.0.10+1

  # ── Utilities ─────────────────────────────────────────────────────────────────
  equatable: ^2.0.5
  intl: ^0.20.2
  permission_handler: ^11.3.1
  geolocator: ^13.0.1
  flutter_local_notifications: ^22.3.0
  http: ^1.6.0
  flutter_background_service: ^5.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  assets:
    - assets/images/
    - assets/icon/
    - assets/data/
